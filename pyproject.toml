[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-privacy-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "greenlet",
    "pydantic-settings",
    "fast-langdetect>=1.0.1",
    "python-stdnum>=1.20",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "uvicorn",
    "ruff",
    "mypy",
]
onnx = [
    "onnxruntime",
    "optimum[onnxruntime]",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["privacy_engine"]
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

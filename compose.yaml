services:
  postgres:
    image: postgres:17
    container_name: ai-privacy-engine-postgres
    environment:
      POSTGRES_DB: privacy_engine_test
      POSTGRES_USER: privacy_user
      POSTGRES_PASSWORD: privacy_password
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U privacy_user -d privacy_engine_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10